services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://productapp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/knowproduct
      PGSSLMODE: disable
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/data
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowproduct
      POSTGRES_USER: productapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productapp -d knowproduct"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  app-data:
